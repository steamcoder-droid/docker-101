services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - auth
      - frontend
      - product

  auth:
    build: ./auth-service
    env_file:
      - .env
    environment:
      AUTH_PORT: 4000
    expose:
      - "4000"
    depends_on:
      - db
      - migrate


  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - auth
      - product

  product:
    build: ./product-service
    env_file:
      - .env
    expose:
      - "5000"
    depends_on:
      - db
      - migrate
    restart: always

  db:
    image: postgres:16.11
    env_file:
      - .env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: postgres:16
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
      - ./db/migrate.sh:/migrate.sh
    command: ["sh", "/migrate.sh"]

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes: 
  postgres_data:
